[package]
name = "prism-llvm"
version = "0.1.0"
edition = "2024"
description = "A Rust abstraction layer for LLVM with a compilation pipeline."
license = "MIT"
repository = "https://github.com/jayywashere/prism"
readme = "README.md"
keywords = ["llvm", "compiler", "inkwell"]
categories = ["compilers"]

[[bin]]
name = "prism"
path = "src/main.rs"

[dependencies]
inkwell = { version = "0.10", features = ["llvm22-1", "llvm22-1-prefer-dynamic"] }
